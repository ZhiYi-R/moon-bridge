<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Bridge</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f1ea;
        --fg: #111111;
        --accent: #e30613;
        --muted: #5c5c5c;
        --card: #ffffff;
        --border: #111111;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f5f5f5;
          --accent: #ff3b45;
          --muted: #a0a0a0;
          --card: #1e1e1e;
          --border: #f5f5f5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--fg);
      }
      .card {
        width: min(400px, calc(100vw - 32px));
        padding: 28px 24px;
        border: 2px solid var(--border);
        background: var(--card);
        box-shadow: 6px 6px 0 var(--border);
        text-align: center;
      }
      .icon {
        width: 72px; height: 72px; margin: 0 auto 16px;
        border: 2px solid var(--border);
        object-fit: cover; background: #f4f1ea;
      }
      h1 { margin: 0 0 8px; font-size: 1.4rem; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      .bar {
        margin-top: 18px; height: 8px; border: 2px solid var(--border);
        overflow: hidden;
      }
      .bar > span {
        display: block; height: 100%; width: 40%; background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(280%); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="./logo-mark.png" width="72" height="72" alt="Moon Bridge" />
      <h1>Moon Bridge</h1>
      <p>正在启动本地服务…</p>
      <div class="bar" aria-hidden="true"><span></span></div>
    </main>
  </body>
</html>
